name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package
        run: |
          mkdir dist
          cp build/Menhir dist/
          tar -czf Menhir-linux-x86_64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Menhir-linux-x86_64.tar.gz

  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        run: brew install qt

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix qt)

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Package
        run: |
          $(brew --prefix qt)/bin/macdeployqt build/Menhir.app -dmg
          mv build/Menhir.dmg Menhir-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Menhir-macos.dmg

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          arch: win64_msvc2022_64

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          mkdir dist
          cp build\Release\Menhir.exe dist\
          windeployqt --release dist\Menhir.exe
          Compress-Archive -Path dist\* -DestinationPath Menhir-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Menhir-windows-x64.zip

  publish:
    name: Publish
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            linux/Menhir-linux-x86_64.tar.gz
            macos/Menhir-macos.dmg
            windows/Menhir-windows-x64.zip
